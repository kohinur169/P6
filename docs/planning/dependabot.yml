# Dependabot Configuration — KD SOLUTION IT
# Copy this file to: kd-solution-it/.github/dependabot.yml
# Language: YAML

version: 2
updates:
  # ----------------------------------------------------------------
  # 1. npm dependencies (Node.js / TypeScript)
  # ----------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ----------------------------------------------------------------
  # 2. GitHub Actions
  # ----------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"

  # ----------------------------------------------------------------
  # 3. Docker (if used)
  # ----------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
